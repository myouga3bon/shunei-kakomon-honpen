<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>俊英高校 入試 設問別対策</title>
<style>
:root{--ink:#33304a;--bg:#fffdf7;--ans:#e0457b;--dia:#e0203a;--hint:#fff2a8;--hintb:#f2c200}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--bg) radial-gradient(circle at 12px 12px,#ffe9f1 3px,transparent 4px) 0 0/48px 48px;color:var(--ink)}
header{padding:8px 10px;text-align:center;background:linear-gradient(120deg,#ffd6e7,#fff1b8 35%,#d4f5dc 65%,#d3e6ff);border-bottom:4px dotted #fff}
.t1{font-size:.95rem;font-weight:800;text-shadow:1px 1px 0 #fff}
.t2{display:flex;align-items:center;justify-content:center;gap:8px 12px;flex-wrap:wrap}
.t2 h1{font-size:1.9rem;margin:0;letter-spacing:.05em;text-shadow:2px 2px 0 #fff}
.kb{display:inline-block;text-decoration:none;font-weight:800;font-size:.85rem;padding:6px 12px;border-radius:999px;border:2.5px solid #1f6fe0;background:#fff;color:#1f6fe0;box-shadow:0 3px 0 #8db9f5}
nav{max-width:1100px;margin:8px auto 0;padding:6px 8px;background:#ffffffe6;border:3px solid #fff;border-radius:20px;box-shadow:0 4px 14px #0000001a;position:sticky;top:4px;z-index:20;backdrop-filter:blur(4px)}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0}
.lb{flex:none;font-size:.72rem;font-weight:800;padding:3px 7px;border-radius:999px;color:#fff;background:#8e6bff;white-space:nowrap}
button{font:inherit;cursor:pointer;border:2px solid #b9d7f7;background:#e9f3ff;color:#1d4f8f;border-radius:999px;padding:5px 11px;font-weight:800;box-shadow:0 2px 0 #b9d7f7;font-size:clamp(.72rem,3.2vw,.9rem)}
button:active{transform:translateY(2px)}
button.on{background:var(--bs,#5aa5f5);border-color:var(--bs,#5aa5f5);color:#fff;box-shadow:0 2px 0 var(--bd,#3a86d6)}
#rs button{flex:1 1 0;min-width:0;white-space:nowrap;padding:5px 2px}
#rq button{flex:1 1 auto}
.english{--bs:#f06fa4;--bd:#cf4a85;--acc:#f06fa4;--accl:#ffdfec;--acct:#a22a63}
.math{--bs:#5aa5f5;--bd:#3a86d6;--acc:#5aa5f5;--accl:#dcecff;--acct:#1d4f8f}
.japanese{--bs:#f2a33a;--bd:#d0841c;--acc:#f2a33a;--accl:#ffeed6;--acct:#8a4f00}
.science{--bs:#3fbf7f;--bd:#26a064;--acc:#3fbf7f;--accl:#daf5e6;--acct:#17663f}
.social{--bs:#a37ff0;--bd:#835ed6;--acc:#a37ff0;--accl:#ece4ff;--acct:#563399}
main{max-width:1100px;margin:0 auto;padding:6px 10px 80px}
.bar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:8px 2px}
.ttl{display:inline-block;padding:5px 14px;border-radius:999px;background:var(--accl);color:var(--acct);font-weight:800;border:2.5px solid var(--acc)}
.lg{font-size:.8rem;color:#6b6585}
.dia{color:var(--dia);font-weight:900}
.card{background:#fff;border:2.5px solid var(--accl);border-left:8px solid var(--acc);border-radius:16px;margin:12px 0;padding:8px 10px;box-shadow:0 4px 10px #0000000d}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}.ch b{color:var(--acct)}.ch .st{font-size:.82rem;color:#555;flex:1;min-width:8em}
.cb{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.ib{display:flex;flex-direction:column;gap:5px;position:sticky;top:var(--navh,110px);max-height:calc(100vh - var(--navh,110px) - 10px);overflow-y:auto;padding:2px 2px 6px}
.ib button{border-radius:10px;padding:5px 6px;font-size:.78rem;min-width:3.6em;text-align:left;white-space:nowrap}
.ib button .dia{margin-right:2px}
.ib button.on .dia{color:#fff}
.pr{min-width:0}
.cr{position:relative;overflow:hidden;width:100%;border:1px solid #ddd;background:#fff;margin-bottom:6px}
.cr img{display:block;width:100%}
.ld{padding:20px;text-align:center;color:#999;font-size:.85rem}
.al{margin-top:8px;border-top:3px dotted var(--accl);padding-top:6px}
.it{border:2px solid var(--accl);border-left:6px solid var(--acc);border-radius:12px;padding:6px 10px;margin:6px 0;background:#fff}
.q{font-weight:800;color:var(--acct);font-size:.9rem}.a{color:var(--ans);font-weight:800}.a::before{content:"★ ";color:#f7b500}.e{font-size:.9rem;white-space:pre-wrap;line-height:1.6}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.25;font-size:.95em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}.fr>span:last-child{padding:0 3px}
mark.h{background:linear-gradient(transparent 35%,var(--hint) 35%);border-bottom:2px solid var(--hintb);color:inherit}mark.h sup{font-size:.62em;color:#8a6a00;font-weight:800}
#xp{display:none;position:fixed;z-index:30;background:#fff;border:3px solid var(--acc,#8e6bff);box-shadow:0 6px 24px #0003;overflow-y:auto;padding:8px 12px 14px}
#xp .xh{display:flex;align-items:center;gap:8px;position:sticky;top:-8px;background:#fff;padding:6px 0;border-bottom:2px dotted var(--accl,#ddd);margin-bottom:6px}
#xp .xh b{flex:1;font-size:.85rem;color:var(--acct,#333)}
#xp .xx{background:#fff;border-color:#e0457b;color:#e0457b;box-shadow:0 2px 0 #f3a9c3;padding:4px 10px}
@media(min-width:900px){
 #xp{right:10px;top:10px;bottom:10px;width:330px;border-radius:16px}
 body.xo main{padding-right:350px;max-width:none}
 body.xo nav{margin-right:350px;margin-left:10px;max-width:none}
}
@media(max-width:899px){
 #xp{left:0;right:0;bottom:0;max-height:42vh;border-radius:18px 18px 0 0;border-bottom:none}
}
</style></head><body>

」。e・p・t・r・e・s・n を並べて present。", 1]]}, {"e": "R2", "l": "令和２年度", "t": "問3 絵を表す単語（並べかえ）", "sg": [[1, 0.07, 0.22, 1.4127]], "it": [["(1)", "book", "「本」。o・o・k・b を並べて book。", 1], ["(2)", "Japanese", "「日本語」。p・J・n・s・a・a・e・e を並べて Japanese。J は大文字。", 1]]}], "問4": [{"e": "R7", "l": "令和７年度", "t": "問4 be動詞・do動詞の選択", "sg": [[2, 0.28, 0.52, 1.4147]], "it": [["(1)", "Do", "you have a pen? は「あなたはペンを持っていますか」。一般動詞 have の疑問文なので Do。", 1], ["(2)", "is", "Mr. Yamada は3人称単数なので is。「ヤマダ先生は先生です」。", 1], ["(3)", "Did", "last year（昨年）があるので過去の疑問文。一般動詞 live の前に Did。", 1], ["(4)", "am", "I には am。I am Kana.「私はカナです」。残りの an / are / does / do は使わない。", 1]]}, {"e": "R4", "l": "令和４年度", "t": "問4 be動詞の選択", "sg": [[2, 0.28, 0.52, 1.4107]], "it": [["(1)", "am", "主語が I のときは am。I am Kumi.「私はクミです」。", 1], ["(2)", "is", "Mr. Yamada は3人称単数なので is。", 1]]}, {"e": "R3", "l": "令和３年度", "t": "問4 be動詞の選択", "sg": [[1, 0.3, 0.415, 1.4127]], "it": [["(1)", "are", "主語が you のときは are。You are an English teacher.「あなたは英語の先生です」。", 1], ["(2)", "were", "Jack and I は複数で、last week（先週）があるので過去形 were。", 1]]}, {"e": "R2", "l": "令和２年度", "t": "問4 be動詞の選択", "sg": [[1, 0.23, 0.33, 1.4127]], "it": [["(1)", "is", "My name は3人称単数なので is。My name is Taro.", 1], ["(2)", "are not", "We は複数なので are。否定なので are not。", 1], ["(3)", "were", "Ken and Tom は複数、last year（昨年）があるので過去形 were。", 1]]}], "問5": [{"e": "R7", "l": "令和７年度", "t": "問5 英文の書きかえ", "sg": [[2, 0.53, 0.72, 1.4147]], "it": [["(1)", "He is sixteen years old.", "主語を I から He にかえる。I am → He is。", 1], ["(2)", "She has a book.", "主語を She にかえる。3人称単数なので have → has。", 1], ["(3)", "He can run fast.", "can を加えると動詞は原形に。runs → run。「彼は速く走ることができる」。", 1]]}, {"e": "R4", "l": "令和４年度", "t": "問5 do動詞の選択", "sg": [[2, 0.53, 0.72, 1.4107]], "it": [["(1)", "Do", "now（今）の一般動詞の疑問文。you には Do。「あなたは今ペットを飼っていますか」。", 1], ["(2)", "Does", "she は3人称単数なので Does。", 1], ["(3)", "Did", "last year（昨年）があるので過去の疑問文 Did。", 1]]}, {"e": "R3", "l": "令和３年度", "t": "問5 疑問詞の選択", "sg": [[1, 0.43, 0.68, 1.4127]], "it": [["(1)", "ウ When", "「いつ」駅に着いたか。Wh const TOK="(?:\\d+(?:\\.\\d+)?(?:√\\d+)?[a-zℓπ]?²?|[a-zℓπ]|√\\d+)";
const NUMP="(?:\\(([^()\\n]{1,40})\\)|(?<![A-Za-z0-9.ℓπ])("+TOK+")(?![A-Za-z]))";
const DENP="(?:\\(([^()\\n]{1,40})\\)|(\\d+(?:\\.\\d+)?(?:√\\d+)?[a-zℓπ]?²?|[a-zℓπ]|√\\d+)(?![A-Za-z0-9]))";
const FR=new RegExp(NUMP+"/"+DENP,"g");
function fr(t){return t.replace(FR,(m,p1,n1,p2,d1)=>{const n=p1||n1,d=p2||d1;if(!/[0-9√π]/.test(n+d))return m;if(/\d[a-z]$/.test(n)&&/^[a-z]$/.test(d))return m;if(p1&&!/[0-9a-zπ√ℓ]/.test(p1))return m;return "<span class='fr'><span>"+n+"</span><span>"+d+"</span></span>"})}
function hint(t){return t.replace(/\{\{([^:}]*):([\s\S]*?)\}\}/g,(m,l,x)=>"<mark class='h'>"+x+"<sup>"+l+"</sup></mark>")}
function rich(t){return hint(fr(esc(t)))}
function qlab(q){return q.replace(/\s/g,'')}
function save(){try{localStorage.setItem('shtk_sel',JSON.stringify([sb,cq,allx]))}catch(_){}}
function navh(){document.documentElement.style.setProperty('--navh',($('nv').offsetHeight+10)+'px')}
function head(){
 const rs=$('rs');rs.querySelectorAll('button').forEach(b=>b.remove());
 for(const k in SN){const b=document.createElement('button');b.textContent=SN[k];b.className=k+(k==sb?' on':'');b.onclick=()=>{sb=k;cq=null;closeX();draw();scrollTo(0,0)};rs.appendChild(b)}
 const rq=$('rq');rq.innerHTML='';rq.className='row '+sb;
 const cs=CATS[sb].filter(([c])=>DATA[sb][c]&&DATA[sb][c].length);
 if(!cq||!cs.some(x=>x[0]==cq))cq=cs[0][0];
 for(const [c,l] of cs){const b=document.createElement('button');b.innerHTML=esc(c)+(l?"<span style='font-size:.75em'> "+esc(l)+"</span>":"");b.className=(c==cq?'on':'');b.onclick=()=>{cq=c;closeX();draw();scrollTo(0,0)};rq.appendChild(b)}
}
let obs=null;
function draw(){
 save();head();document.body.className=sb+(document.body.classList.contains('xo')?' xo':'');$('xp').className=sb;
 const L=DATA[sb][cq]||[];
 let h="<div class='bar'><span class='ttl'>"+esc(cq)+"　過去問"+L.length+"回分（新しい順）</span><button id='ax' class='"+(allx?'on':'')+"'>"+(allx?'解説の一覧を閉じる':'📋 問題と解説を一覧で表示')+"</button></div>";
 h+="<p class='lg'><span class='dia'>♦</span>＝合格目安65点をとるために、確実に正解したい問題（配点は推測です）。左のボタンを押すと解説が出ます。</p>";
 L.forEach((x,ci)=>{
  const nd=x.it.filter(i=>i[3]).length;
  h+="<div class='card' id='c"+ci+"'><div class='ch'><b>"+esc(x.l)+"</b><span class='st'>"+esc(x.t)+"</span><span class='lg'><span class='dia'>♦</span>"+nd+"/"+x.it.length+"</span></div><div class='cb'><div class='ib'>";
  x.it.forEach((it,j)=>{h+="<button data-c='"+ci+"' data-j='"+j+"'>"+(it[3]?"<span class='dia'>♦</span>":"")+esc(qlab(it[0]))+"</button>"});
  h+="</div><div class='pr'><div class='pg' data-c='"+ci+"'><div class='ld'>問題を読み込み中…</div></div>";
  if(allx)h+="<div class='al'>"+x.it.map(it=>itemHTML(x,it)).join('')+"</div>";
  h+="</div></div></div>"});
 $('m').innerHTML=h;
 $('ax').onclick=()=>{allx=!allx;const y=scrollY;draw();scrollTo(0,y)};
 $('m').querySelectorAll('.ib button').forEach(b=>b.onclick=()=>showX(+b.dataset.c,+b.dataset.j,b));
 if(obs)obs.disconnect();
 obs=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){obs.unobserve(en.target);fill(en.target)}}),{rootMargin:'600px'});
 $('m').querySelectorAll('.pg').forEach(el=>obs.observe(el));
 navh();
}
function itemHTML(x,it){const [q,a,e,d]=it;return "<div class='it'><div class='q'>"+(d?"<span class='dia'>♦</span> ":"")+esc(q)+"</div>"+(a&&a!=='—'?"<div class='a'>答："+rich(a)+"</div>":"")+"<div class='e'>"+rich(e)+"</div></div>"}
async function fill(el){
 const x=DATA[sb][cq][+el.dataset.c],key=x.e+'_'+sb;
 try{await load(key)}catch(_){el.innerHTML="<div class='ld'>読み込みに失敗しました</div>";return}
 const P=IMG[key];let h='';
 for(const [p,y0,y1,r] of x.sg){const src=P[p];if(!src)continue;
  const hh=(y1-y0)*r;h+="<div class='cr' style='aspect-ratio:1/"+hh.toFixed(4)+"'><img loading='lazy' src='"+src+"' style='margin-top:-"+(y0*r*100).toFixed(3)+"%'></div>"}
 el.innerHTML=h||"<div class='ld'>（ページがありません）</div>";
}
function showX(ci,j,b){
 if(cur&&cur[0]==ci&&cur[1]==j){closeX();return}
 const x=DATA[sb][cq][ci],it=x.it[j];
 document.querySelectorAll('.ib button.on').forEach(z=>z.classList.remove('on'));b.classList.add('on');cur=[ci,j];
 const xp=$('xp');xp.className=sb;xp.innerHTML="<div class='xh'><b>"+esc(x.l)+"　"+esc(x.t)+"</b><button class='xx' id='xx'>✕ 閉じる</button></div>"+itemHTML(x,it);
 xp.style.display='block';xp.scrollTop=0;document.body.classList.add('xo');$('xx').onclick=closeX;
 if(innerWidth<900){const ph=xp.offsetHeight;$('m').style.paddingBottom=(ph+20)+'px';const r=b.getBoundingClientRect();if(r.bottom>innerHeight-ph-8)scrollBy({top:r.bottom-(innerHeight-ph-40),behavior:'smooth'})}
}
function closeX(){cur=null;$('m').style.paddingBottom='';$('xp').style.display='none';document.body.classList.remove('xo');document.querySelectorAll('.ib button.on').forEach(z=>z.classList.remove('on'))}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeX()});
addEventListener('resize',navh);
draw();
</script></body></html>
